<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <title>IPTV Player</title>
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 30px; }
        input { width: 600px; padding: 10px; font-size: 14px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; }
        button { margin-left: 10px; padding: 10px 20px; background: #e00; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        video { margin-top: 20px; width: 800px; max-width: 100%; background: #000; border-radius: 6px; }
        #status { margin-top: 10px; font-size: 13px; color: #aaa; }
    </style>
</head>
<body>
    <h2>IPTV Player</h2>
    <div>
        <input id="url" type="text" placeholder="https://example.com/stream/index.m3u8" />
        <button onclick="play()">Play</button>
    </div>
    <video id="video" controls autoplay></video>
    <div id="status"></div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        function play() {
            const url = document.getElementById('url').value.trim();
            const video = document.getElementById('video');
            const status = document.getElementById('status');

            if (!url) return;

            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play();
                    status.textContent = 'Stream učitan.';
                });
                hls.on(Hls.Events.ERROR, (e, data) => {
                    status.textContent = 'Greška: ' + data.details;
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Safari native HLS
                video.src = url;
                video.play();
            } else {
                status.textContent = 'Browser ne podržava HLS.';
            }
        }

        document.getElementById('url').addEventListener('keydown', e => {
            if (e.key === 'Enter') play();
        });
    </script>
</body>
</html>
